<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">物価高対策のイメージ図</title><desc id="d">日々の買い物の負担を見つめ、制度を設計し、家計への効果と財源を検証する流れ。</desc><rect width="720" height="420" rx="24" fill="#fff8ec"/><circle cx="590" cy="76" r="44" fill="#ffe2b6"/><path d="M0 332 Q150 280 280 330 T720 314 V420 H0Z" fill="#ffedd5"/><g transform="translate(54 95)"><rect x="0" y="30" width="210" height="205" rx="16" fill="#fff" stroke="#f0c58d" stroke-width="2"/><path d="M0 68H210" stroke="#f0c58d" stroke-width="2"/><path d="M20 30V8H190V30" fill="#f4a340" stroke="#c77b27" stroke-width="3" stroke-linejoin="round"/><rect x="22" y="92" width="46" height="52" rx="7" fill="#ffcb73"/><rect x="82" y="92" width="46" height="52" rx="7" fill="#b5dfb5"/><rect x="142" y="92" width="46" height="52" rx="7" fill="#f2a1a1"/><path d="M45 99v39M105 98v40M164 100v38" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="22" y="163" width="166" height="48" rx="8" fill="#fff3e0"/><text x="105" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#8f5b22">日々の買い物</text><text x="105" y="199" text-anchor="middle" font-size="10" fill="#946b40">負担の変化を確認</text></g><g fill="none" stroke="#cf842f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M278 204H325"/><path d="M313 192l12 12-12 12"/></g><g transform="translate(340 130)"><rect width="150" height="150" rx="22" fill="#fff" stroke="#f0c58d" stroke-width="2"/><circle cx="75" cy="49" r="24" fill="#ffdc9d"/><path d="M75 33v32M59 49h32" stroke="#bd7823" stroke-width="6" stroke-linecap="round"/><text x="75" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#6e4b21">制度を設計</text><text x="75" y="115" text-anchor="middle" font-size="11" fill="#8c6a43">対象・期間・手順</text><text x="75" y="132" text-anchor="middle" font-size="11" fill="#8c6a43">財源も確認</text></g><g fill="none" stroke="#cf842f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M502 20