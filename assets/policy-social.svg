<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">社会保障政策のイメージ図</title><desc id="d">必要な医療と介護を守りながら、保険料負担と制度の持続可能性のバランスを取る。</desc><rect width="720" height="420" rx="24" fill="#eef6ff"/><circle cx="614" cy="83" r="57" fill="#d4e8ff"/><path d="M0 337Q150 285 330 334T720 315V420H0Z" fill="#e0eeff"/><text x="42" y="50" font-size="13" font-weight="800" letter-spacing="2" fill="#286eb7">SOCIAL SECURITY</text><g transform="translate(65 87)"><path d="M120 0l88 31v79c0 59-40 101-88 125-48-24-88-66-88-125V31Z" fill="#fff" stroke="#8dbdeb" stroke-width="3"/><path d="M120 47c-15-20-46-7-46 16 0 27 46 53 46 53s46-26 46-53c0-23-31-36-46-16Z" fill="#ed9aab"/><path d="M81 96h23l12-20 16 42 13-22h19" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="120" y="179" text-anchor="middle" font-size="14" font-weight="800" fill="#1a4d7d">安心の基盤</text></g><g transform="translate(320 98)"><rect width="330" height="65" rx="12" fill="#fff" stroke="#b5d3f3" stroke-width="2"/><circle cx="36" cy="32" r="20" fill="#d8eaff"/><path d="M26 32h20M36 22v20" stroke="#307bc1" stroke-width="4" stroke-linecap="round"/><text x="70" y="28" font-size="15" font-weight="800" fill="#194a78">必要な医療</text><text x="70" y="47" font-size="11" fill="#607f9d">地域で受けられる体制を守る</text></g><g transform="translate(320 181)"><rect width="330" height="65" rx="12" fill="#fff" stroke="#b5d3f3" stroke-width="2"/><circle cx="36" cy="32" r="20" fill="#d8eaff"/><path d="M24 40v-15h24v15M29 25v-6h14v6" stroke="#307bc1" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="70" y="28" font-size="15" font-weight="800" fill="#194a78">介護と暮らし</text><text x="70" y="47" font-size="11" fill="#607f9d">利用者と現場を支える</text></g><g transform="translate(320 264)"><rect width="330" height="65" rx="12" fill="#fff" stroke="#b5d3f3" stroke-width="2"/><circle cx="36" cy="32" r="20" fill="#d8eaff"/><path d="M23 26h26v17H23zM29 21h14" stroke="#307bc1" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="70" y="28" font-size="15" font-weight="800" fill="#194a78">負担と給付の公平性</text><text x="70" y="47" font-size="11" fill="#607f9d">将来に続く仕組みを検討</text></g><text x="42" y="376" font-size="17" font-weight="800" fill="#205c94">必要な安心を守り、持続可能な制度へ</text></svg>