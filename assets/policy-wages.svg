<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">賃金・雇用政策のイメージ図</title><desc id="d">企業の生産性向上、公正な取引、働く人の能力開発をつなぎ、持続的な賃上げを目指す。</desc><rect width="720" height="420" rx="24" fill="#eefaf4"/><circle cx="630" cy="70" r="62" fill="#d3f0df"/><path d="M0 334 Q140 280 290 332 T720 316 V420 H0Z" fill="#dff5e8"/><text x="42" y="50" font-size="13" font-weight="800" letter-spacing="2" fill="#178357">WORK &amp; WAGES</text><g transform="translate(50 96)"><rect width="166" height="200" rx="16" fill="#fff" stroke="#a9dfc0" stroke-width="2"/><rect x="22" y="25" width="122" height="78" rx="8" fill="#e5f7ed"/><path d="M34 87l29-28 23 13 39-33" fill="none" stroke="#26986a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M113 39h12v12" fill="none" stroke="#26986a" stroke-width="4" stroke-linecap="round"/><text x="83" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#164c37">生産性向上</text><text x="83" y="155" text-anchor="middle" font-size="11" fill="#527767">設備・デジタル化</text><text x="83" y="173" text-anchor="middle" font-size="11" fill="#527767">仕事の効率を高める</text></g><g fill="none" stroke="#219968" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M229 195h32"/><path d="M249 183l12 12-12 12"/></g><g transform="translate(276 96)"><rect width="166" height="200" rx="16" fill="#fff" stroke="#a9dfc0" stroke-width="2"/><circle cx="83" cy="62" r="38" fill="#d8f2e3"/><path d="M58 61h50M83 36v50" stroke="#26986a" stroke-width="5" stroke-linecap="round"/><path d="M66 49l34 26M100 49L66 75" stroke="#75c99c" stroke-width="3" stroke-linecap="round"/><text x="83" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#164c37">公正な取引</text><text x="83" y="155" text-anchor="middle" font-size="11" fill="#527767">適切な価格転嫁</text><text x="83" y="173" text-anchor="middle" font-size="11" fill="#527767">中小企業を支える</text></g><g fill="none" stroke="#219968" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M455 195h32"/><path d="M475 183l12 12-12 12"/></g><g transform="translate(502 96)"><rect width="166" height="200" rx="16" fill="#fff" stroke="#a9dfc0" stroke-width="2"/><circle cx="83" cy="60" r="38" fill="#c6ebd5"/><path d="M66 76V54l17-12 17 12v22M76 76V62h14v14" fill="none" stroke="#20855c" stroke-width="4" stroke-linejoin="round"/><text x="83" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#164c37">賃金・雇用</text><text x="83" y="155" text-anchor="middle" font-size="11" fill="#527767">所得と働きやすさ</text><text x="83" y="173" text-anchor="middle" font-size="11" fill="#527767">両方を高める</text></g><text x="42" y="357" font-size="17" font-weight="800" fill="#176b49">会社と働く人を支え、続けられる賃上げへ</text></svg>