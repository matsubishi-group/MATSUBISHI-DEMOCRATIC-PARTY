name: Install latest exact representative photo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-representative-photo.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble verified photo from the exact user-uploaded image
        shell: bash
        run: |
          set -euo pipefail
          for f in 00 01 02 03; do
            test "$(wc -c < "tmp-representative-final/part${f}.txt")" -eq 10000
          done
          test "$(wc -c < tmp-representative-final/part04.txt)" -eq 5588
          cat tmp-representative-final/part00.txt tmp-representative-final/part01.txt tmp-representative-final/part02.txt tmp-representative-final/part03.txt tmp-representative-final/part04.txt > /tmp/representative.b64
          test "$(wc -c < /tmp/representative.b64)" -eq 45588
          base64 --decode /tmp/representative.b64 > assets/representative-scratch-cat.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path("assets/representative-scratch-cat.webp")
          data = p.read_bytes()
          assert len(data) == 34190, f"Unexpected image length: {len(data)}"
          assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", "Not a WebP image"
          assert int.from_bytes(data[4:8], "little") + 8 == len(data), "RIFF length mismatch"
          print(f"Verified uploaded representative image: {len(data)} bytes")
          PY
          rm -rf tmp-representative-final tmp-representative-high
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace representative message photo with exact latest upload"
          git push
