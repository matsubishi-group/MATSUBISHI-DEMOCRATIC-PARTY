<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081b37">
  <meta name="robots" content="noindex, nofollow">
  <title>回答を受け付けました｜松菱民主党</title>
  <link rel="icon" href="assets/logo-tree.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=20261030-fadecount">
  <link rel="stylesheet" href="voice.css?v=20261030-no-header-home-link">
</head>
<body class="voice-page thanks-page">
  <div class="topline"><div class="container topline-inner"><span><i class="status-dot"></i> 松菱民主党 公式サイト</span><span class="topline-right">対話を力に、前へ進む政党へ。</span></div></div>
  <header class="site-header voice-header">
    <div class="container voice-header-inner">
      <div class="brand" aria-label="松菱民主党">
        <img src="assets/logo-tree.png" width="48" height="48" alt="">
        <span class="brand-text"><strong>松菱民主党</strong><small>MATSUBISHI DEMOCRATIC PARTY</small></span>
      </div>
    </div>
  </header>
  <main class="thanks-main">
    <div class="thanks-card">
      <div class="thanks-emblem" aria-hidden="true"><span>✓</span></div>
      <p class="thanks-kicker">THANK YOU FOR YOUR VOICE</p>
      <h1>回答を受け付けました</h1>
      <div class="thanks-rule"></div>
      <p class="thanks-message">ご回答ありがとうございました。<br>松菱民主党のアンケートにご協力いただき、ありがとうございます。</p>
      <div class="thanks-return">
        <span class="thanks-return-label">HOME PAGE</span>
        <p><strong id="countdown">5</strong>秒後にトップページへ自動的に戻ります。</p>
        <div class="thanks-progress" aria-hidden="true"><span id="countdownProgress"></span></div>
      </div>
      <a class="thanks-home-button" href="index.html">今すぐトップページへ戻る <span aria-hidden="true">→</span></a>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© <span id="year">2026</span> 松菱民主党プロジェクト</p>
      <p class="project-disclaimer">本サイトはScratch上で展開する架空の政党プロジェクトの紹介サイトです。</p>
    </div>
  </footer>
  <script>
    (() => {
      const counter = document.getElementById('countdown');
      const card = document.querySelector('.thanks-card');
      const progress = document.getElementById('countdownProgress');
      document.getElementById('year').textContent = new Date().getFullYear();

      let countdownStarted = false;
      let countdownTimer = null;

      const startCountdown = () => {
        if (countdownStarted) return;
        countdownStarted = true;

        if (progress) progress.classList.add('is-counting');

        const deadline = Date.now() + 5000;
        const updateCountdown = () => {
          const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
          if (counter) counter.textContent = String(remaining);
          if (remaining === 0) {
            window.clearInterval(countdownTimer);
            window.location.replace('index.html');
          }
        };

        countdownTimer = window.setInterval(updateCountdown, 100);
        updateCountdown();
      };

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!card || reducedMotion) {
        startCountdown();
      } else {
        const onFadeInFinished = event => {
          if (event.target !== card || event.animationName !== 'thanks-fade-in') return;
          card.removeEventListener('animationend', onFadeInFinished);
          startCountdown();
        };

        card.addEventListener('animationend', onFadeInFinished);
        // Safety fallback in case an animation event is not delivered by the browser.
        window.setTimeout(startCountdown, 1100);
      }
    })();
  </script>
</body>
</html>
